[project]
name = "kiroshi"
version = "0.1.0"
description = "An opinionated image diffusion server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "adetailer",
    "compel>=2.5.1",
    "comfy-kitchen>=0.2.37",
    "diffusers>=0.41.0",
    "ftfy>=6.3.1",
    "numpy>=2.5.4",
    "peft>=0.21.2",
    "pillow>=12.3.0",
    "realesrgan",
    "safetensors>=0.6.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[tool.uv.sources]
realesrgan = { git = "https://github.com/hecrj/RealESRGAN.git", rev = "8bf30248f1acccb0808378a00d08c3ba3d473180" }
adetailer = { git = "https://github.com/hecrj/adetailer.git", rev = "25e7509fe018de8aa063a5f1902598f5eda0c06c" }
# diffusers = { git = "https://github.com/hecrj/diffusers.git", rev = "a945347695954d30d8fd9ce638823bbaa95e34b4" }

[tool.uv.extra-build-dependencies]
realesrgan = ["setuptools==80.10.2"]
